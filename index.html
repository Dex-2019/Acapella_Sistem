<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acapella — Sistema de Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#121212;
    --panel:#191919;
    --panel-2:#212121;
    --line:#2b2924;
    --yellow:#F5C518;
    --yellow-dim:#C9A314;
    --text:#F2F0E9;
    --text-mute:#9C988D;
    --danger:#E5484D;
    --danger-bg:rgba(229,72,77,.12);
    --success:#3DD68C;
    --success-bg:rgba(61,214,140,.12);
    --warn:#F0A93C;
    --warn-bg:rgba(240,169,60,.12);
    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--font-body);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--yellow); color:#121212; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:14px; }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-display); font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; font-size:11px;
    color:var(--text-mute);
  }
  .eyebrow::before{
    content:""; width:10px; height:10px; background:var(--yellow);
    clip-path:polygon(0 0, 100% 0, 100% 60%, 40% 60%, 15% 100%, 15% 60%, 0 60%);
    flex:0 0 auto;
  }
  h1,h2,h3{ font-family:var(--font-display); font-weight:600; letter-spacing:-.01em; }

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 600px at 15% 0%, rgba(245,197,24,.08), transparent 60%),
      var(--ink);
    padding:24px;
  }
  .login-card{
    width:100%; max-width:380px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:36px 32px;
  }
  .login-logo{ display:flex; justify-content:center; margin-bottom:22px; }
  .login-logo img{ width:88px; height:88px; border-radius:18px; }
  .login-card h1{ font-size:20px; text-align:center; margin-bottom:4px; }
  .login-sub{ text-align:center; color:var(--text-mute); font-size:13px; margin-bottom:26px; }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:11px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--text-mute); margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text); border-radius:8px; padding:11px 12px; outline:none;
    transition:border-color .15s;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--yellow);
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; border-radius:8px; padding:11px 18px; font-weight:600; font-size:13.5px;
    transition:transform .1s, opacity .15s;
  }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--yellow); color:#121212; }
  .btn-primary:hover{ background:var(--yellow-dim); }
  .btn-block{ width:100%; }
  .btn-ghost{ background:transparent; color:var(--text-mute); border:1px solid var(--line); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--text-mute); }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); }
  .btn-danger:hover{ opacity:.8; }
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .navlink:focus-visible{
    outline:2px solid var(--yellow); outline-offset:2px;
  }
  .login-error{
    display:none; background:var(--danger-bg); color:var(--danger);
    border-radius:8px; padding:10px 12px; font-size:12.5px; margin-bottom:16px;
  }
  .login-config-warning{
    display:none; background:var(--warn-bg); color:var(--warn);
    border-radius:8px; padding:10px 12px; font-size:12px; margin-bottom:16px; line-height:1.5;
  }

  /* ---------- APP SHELL ---------- */
  #app-shell{ display:none; min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }

  .sidebar{
    width:240px; flex:0 0 auto; background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .sidebar-brand{
    display:flex; align-items:center; gap:10px; padding:20px 18px 16px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-brand img{ width:34px; height:34px; border-radius:8px; }
  .sidebar-brand span{ font-family:var(--font-display); font-weight:700; letter-spacing:.02em; font-size:15px; }
  .nav{ padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .navlink{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px;
    color:var(--text-mute); text-decoration:none; font-weight:500; font-size:13.5px;
    background:none; border:none; width:100%; text-align:left;
  }
  .navlink .ic{ width:18px; text-align:center; font-size:15px; }
  .navlink:hover{ background:var(--panel-2); color:var(--text); }
  .navlink.active{ background:var(--yellow); color:#121212; font-weight:600; }
  .sidebar-footer{ padding:14px 10px; border-top:1px solid var(--line); }

  .main{ flex:1; min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-bottom:1px solid var(--line);
    background:rgba(18,18,18,.85); backdrop-filter:blur(6px);
  }
  #mobile-menu-btn{ display:none; background:none; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; }
  .topbar-title{ font-size:18px; }
  .topbar-sub{ color:var(--text-mute); font-size:12.5px; margin-top:2px; }
  .content{ padding:28px; max-width:1180px; }

  .grid{ display:grid; gap:16px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:repeat(2,1fr); }
  @media (max-width: 980px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;
  }
  .stat-card .stat-label{
    font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-mute);
  }
  .stat-card .stat-value{ font-family:var(--font-display); font-size:26px; font-weight:700; margin-top:8px; }
  .stat-card .stat-note{ font-size:12px; color:var(--text-mute); margin-top:6px; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:17px; }

  .toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .toolbar input[type=text], .toolbar input[type=search], .toolbar select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 12px; outline:none; font-size:13px;
  }
  .toolbar input:focus, .toolbar select:focus{ border-color:var(--yellow); }
  .filter-tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .filter-tab{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-mute);
    padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:500;
  }
  .filter-tab.active{ background:var(--yellow); color:#121212; border-color:var(--yellow); font-weight:600; }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-mute); font-weight:600; padding:0 14px 10px; border-bottom:1px solid var(--line);
  }
  tbody td{ padding:13px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  tbody tr:hover{ background:var(--panel-2); }
  tbody tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
  .table-wrap table{ min-width:640px; }
  .row-actions{ display:flex; gap:6px; }
  .icon-btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-mute);
    border-radius:7px; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ color:var(--text); border-color:var(--text-mute); }

  .badge{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px;
    font-size:11.5px; font-weight:600;
  }
  .badge-dot{ width:6px; height:6px; border-radius:50%; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-mute);
  }
  .empty-state .ic{ font-size:30px; margin-bottom:10px; }
  .empty-state h3{ color:var(--text); font-size:15px; margin-bottom:6px; }
  .empty-state p{ font-size:13px; max-width:320px; margin:0 auto 18px; }

  /* Modal */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6);
    align-items:flex-start; justify-content:center; z-index:50; padding:40px 16px; overflow-y:auto;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    width:100%; max-width:520px; padding:26px;
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .modal-head h3{ font-size:17px; }
  .modal-close{ background:none; border:none; color:var(--text-mute); font-size:20px; line-height:1; }
  .modal-close:hover{ color:var(--text); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid .full{ grid-column:1 / -1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }

  .toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--yellow);
    padding:12px 16px; border-radius:8px; font-size:13px; min-width:220px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .toast.error{ border-left-color:var(--danger); }

  .loader{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(0,0,0,.25);
    border-top-color:#121212; animation:spin .7s linear infinite; display:inline-block;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .day-group{ margin-bottom:22px; }
  .day-group h4{
    font-family:var(--font-display); font-size:13px; color:var(--yellow);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;
  }
  .content-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
  }

  @media (max-width: 860px){
    .sidebar{ position:fixed; left:-260px; z-index:40; transition:left .2s; box-shadow:0 0 0 rgba(0,0,0,0); }
    .sidebar.open{ left:0; box-shadow:20px 0 40px rgba(0,0,0,.4); }
    #mobile-menu-btn{ display:inline-flex; }
    .form-grid{ grid-template-columns:1fr; }
    .content{ padding:18px; }
    .topbar{ padding:14px 18px; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><img src="LOGO_ACAPELLA.png" alt="Acapella" onerror="this.style.display='none'"/></div>
    <h1>Acapella</h1>
    <p class="login-sub">Sistema de gestión — acceso de administrador</p>
    <div class="login-config-warning" id="config-warning">
      ⚠️ Falta configurar Firebase. Edita el objeto <code>firebaseConfig</code> al inicio del &lt;script&gt; con las llaves de tu proyecto.
    </div>
    <div class="login-error" id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Correo</label>
        <input type="email" id="login-email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Entrar</button>
    </form>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app-shell">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="LOGO_ACAPELLA.png" alt="Acapella" onerror="this.style.display='none'"/>
        <span>ACAPELLA</span>
      </div>
      <nav class="nav" id="nav-links"></nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-block" id="logout-btn">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:14px;">
          <button id="mobile-menu-btn">☰</button>
          <div>
            <div class="topbar-title" id="topbar-title">Dashboard</div>
            <div class="topbar-sub" id="topbar-sub">—</div>
          </div>
        </div>
        <div style="font-size:12.5px; color:var(--text-mute);" id="topbar-date"></div>
      </div>
      <div class="content" id="view-root">
        <!-- vistas renderizadas por JS -->
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Nuevo registro</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <form id="modal-form">
      <div class="form-grid" id="modal-form-grid"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="modal-save">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================================
   1) CONFIGURA AQUÍ TU PROYECTO DE FIREBASE
   Ve a https://console.firebase.google.com → tu proyecto → ⚙️ Configuración
   del proyecto → "Tus apps" → app web → copia el objeto firebaseConfig.
   Luego habilita:
   - Authentication → Sign-in method → Correo/Contraseña
   - Authentication → Users → agrega TU usuario admin (correo + contraseña)
   - Firestore Database → Crear base de datos (modo producción)
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAEkulylABvqt3XXmLVty9BqvorgISCPzo",
  authDomain: "acapella-sistem.firebaseapp.com",
  projectId: "acapella-sistem",
  storageBucket: "acapella-sistem.firebasestorage.app",
  messagingSenderId: "69681273904",
  appId: "1:69681273904:web:7d1cdca0b87b62625ee1f5",
  measurementId: "G-1RNEQRLY13"
};

const isConfigured = !Object.values(firebaseConfig).some(v => String(v).startsWith("TU_"));
if (!isConfigured) {
  document.getElementById("config-warning").style.display = "block";
}

let app, auth, db;
if (isConfigured) {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
}

/* ============================== ESTADO ================================ */
const state = {
  user: null,
  view: "dashboard",
  cache: {}, // { collectionName: [ {id, ...data}, ... ] }
  listeners: {},
  modal: { schemaKey: null, editId: null },
  filters: {}, // filtros de tabla por schemaKey
};

/* ============================ FORMATEO ================================ */
const fmtMoney = (n) => "L " + (Number(n)||0).toLocaleString("es-HN", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = (d) => {
  if(!d) return "—";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString("es-HN", {day:"2-digit", month:"short", year:"numeric"});
};
const todayISO = () => new Date().toISOString().slice(0,10);

const SUCCESS_VALUES = ["Activo","Completada","Completado","Pagado","Aprobado","Publicado","Ganado","Aceptada"];
const WARN_VALUES = ["Pendiente","En proceso","En revisión","Producción","Diseño","Revisión","Programado","Contactado","Conversación","Propuesta","Negociación","Borrador","Enviada","En progreso"];
const DANGER_VALUES = ["Atrasada","Vencida","Inactivo","Perdido","Rechazada","Pausado"];
function badgeHtml(value){
  if(!value) return "";
  let cls = "neutral";
  if(SUCCESS_VALUES.includes(value)) cls = "success";
  else if(WARN_VALUES.includes(value)) cls = "warn";
  else if(DANGER_VALUES.includes(value)) cls = "danger";
  const colors = {
    success:{bg:"var(--success-bg)", c:"var(--success)"},
    warn:{bg:"var(--warn-bg)", c:"var(--warn)"},
    danger:{bg:"var(--danger-bg)", c:"var(--danger)"},
    neutral:{bg:"var(--panel-2)", c:"var(--text-mute)"}
  }[cls];
  return `<span class="badge" style="background:${colors.bg}; color:${colors.c};"><span class="badge-dot" style="background:${colors.c};"></span>${value}</span>`;
}
function priorityBadge(value){
  const map = {"Urgente":"🔴","Alta":"🟠","Media":"🟡","Baja":"🟢"};
  return `<span class="badge" style="background:var(--panel-2); color:var(--text);">${map[value]||""} ${value||""}</span>`;
}

function toast(msg, isError){
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 3800);
}

/* ============================ ESQUEMAS ================================= */
// Cada esquema define una colección de Firestore y cómo se ve su tabla/formulario.
const SCHEMAS = {
  clients: {
    label: "Clientes", singular: "Cliente", icon: "👥", collection: "clients",
    orderBy: "nombre",
    columns: ["nombre","empresa","estado","precioMensual","diaPago"],
    fields: [
      {key:"nombre", label:"Nombre", type:"text", required:true},
      {key:"empresa", label:"Empresa", type:"text"},
      {key:"contacto", label:"Contacto", type:"text"},
      {key:"telefono", label:"Teléfono", type:"text"},
      {key:"correo", label:"Correo", type:"text"},
      {key:"redes", label:"Redes sociales", type:"text"},
      {key:"fechaInicio", label:"Fecha de inicio", type:"date"},
      {key:"estado", label:"Estado", type:"select", options:["Activo","Inactivo"], default:"Activo"},
      {key:"plan", label:"Plan contratado", type:"text"},
      {key:"precioMensual", label:"Precio mensual (L)", type:"number"},
      {key:"diaPago", label:"Día de pago", type:"number"},
      {key:"notas", label:"Notas", type:"textarea", full:true},
    ]
  },
  tasks: {
    label: "Tareas", singular: "Tarea", icon: "📋", collection: "tasks",
    orderBy: "deadline",
    columns: ["nombre","clienteId","prioridad","estado","deadline"],
    fields: [
      {key:"nombre", label:"Nombre", type:"text", required:true, full:true},
      {key:"clienteId", label:"Cliente", type:"select-ref", ref:"clients"},
      {key:"proyectoId", label:"Proyecto", type:"select-ref", ref:"projects"},
      {key:"prioridad", label:"Prioridad", type:"select", options:["Urgente","Alta","Media","Baja"], default:"Media"},
      {key:"estado", label:"Estado", type:"select", options:["Pendiente","En proceso","En revisión","Completada"], default:"Pendiente"},
      {key:"fechaInicio", label:"Fecha de inicio", type:"date"},
      {key:"deadline", label:"Deadline", type:"date"},
      {key:"responsable", label:"Responsable", type:"text"},
      {key:"notas", label:"Notas", type:"textarea", full:true},
    ]
  },
  content: {
    label: "Contenido", singular: "Contenido", icon: "🎬", collection: "content",
    orderBy: "fechaPublicacion",
    columns: ["tema","clienteId","tipo","plataforma","estado","fechaPublicacion"],
    fields: [
      {key:"clienteId", label:"Cliente", type:"select-ref", ref:"clients"},
      {key:"tipo", label:"Tipo", type:"select", options:["Reel","TikTok","Post","Carrusel","Story","Video","Campaña"]},
      {key:"plataforma", label:"Plataforma", type:"text"},
      {key:"tema", label:"Tema", type:"text", full:true},
      {key:"copy", label:"Copy", type:"textarea", full:true},
      {key:"fechaPublicacion", label:"Fecha de publicación", type:"date"},

/* ========================= FIRESTORE LISTENERS ========================= */
function startListeners(){
  Object.values(SCHEMAS).forEach(schema => {
    const q = query(collection(db, schema.collection));
    state.listeners[schema.collection] = onSnapshot(q, (snap) => {
      const rows = [];
      snap.forEach(d => rows.push({id:d.id, ...d.data()}));
      // orden simple por el campo indicado (texto/fecha), nulos al final
      rows.sort((a,b) => {
        const av = a[schema.orderBy] || "";
        const bv = b[schema.orderBy] || "";
        return String(av).localeCompare(String(bv));
      });
      state.cache[schema.collection] = rows;
      if (state.view === schema.collection || state.view === "dashboard" || state.view === "finance") {
        render();
      }
    }, (err) => {
      console.error(err);
      toast("No se pudo leer '" + schema.collection + "'. Revisa las reglas de Firestore.", true);
    });
  });
}
function stopListeners(){
  Object.values(state.listeners).forEach(unsub => unsub && unsub());
  state.listeners = {};
  state.cache = {};
}

function refLabel(refCollection, id){
  if(!id) return "—";
  const rows = state.cache[refCollection] || [];
  const row = rows.find(r => r.id === id);
  if(!row) return "—";
  return row.nombre || row.empresa || row.titulo || "—";
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const tasks = state.cache.tasks || [];
  const today = todayISO();
  const tasksToday = tasks.filter(t => t.deadline === today && t.estado !== "Completada");
  const tasksOverdue = tasks.filter(t => t.deadline && t.deadline < today && t.estado !== "Completada");
  const content = state.cache.content || [];
  const contentPending = content.filter(c => c.estado !== "Publicado");
  const clientsActive = (state.cache.clients||[]).filter(c => c.estado === "Activo");
  const projectsActive = (state.cache.projects||[]).filter(p => p.estado === "Activo");
  const thisMonth = today.slice(0,7);
  const incomeThisMonth = (state.cache.finance_income||[]).filter(i => (i.fecha||"").startsWith(thisMonth)).reduce((s,i)=>s+(Number(i.monto)||0),0);
  const mrr = clientsActive.reduce((s,c)=>s+(Number(c.precioMensual)||0),0);
  const objectivesMonth = (state.cache.objectives||[]).filter(o => o.tipo === "Mensual");
  const objectivesDone = objectivesMonth.filter(o => o.estado === "Completado").length;

  viewRoot.innerHTML = `
    <div class="grid grid-4" style="margin-bottom:22px;">
      ${statCard("Tareas de hoy", tasksToday.length, tasksOverdue.length + " atrasadas")}
      ${statCard("Contenido pendiente", contentPending.length, "por producir/publicar")}
      ${statCard("Clientes activos", clientsActive.length, projectsActive.length + " proyectos activos")}
      ${statCard("Ingresos del mes", fmtMoney(incomeThisMonth), "MRR: " + fmtMoney(mrr))}
    </div>
    <div class="grid grid-2">
      <div class="card">
        <div class="section-head"><h2>🔴 Tareas atrasadas y de hoy</h2></div>
        ${renderMiniTaskList([...tasksOverdue, ...tasksToday])}
      </div>
      <div class="card">
        <div class="section-head"><h2>🎯 Objetivos del mes</h2></div>
        ${objectivesMonth.length ? `<p style="color:var(--text-mute); font-size:13px; margin-bottom:10px;">${objectivesDone}/${objectivesMonth.length} objetivos completados</p>` : ""}
        ${renderMiniObjectives(objectivesMonth)}
      </div>
    </div>
  `;
}
function statCard(label, value, note){
  return `<div class="card stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`;
}
function renderMiniTaskList(list){
  if(!list.length) return emptyState("✅","Nada pendiente","No tienes tareas urgentes ahora mismo.");
  return list.slice(0,6).map(t => `
    <div class="content-item">
      <div>
        <div style="font-weight:600;">${escapeHtml(t.nombre||"")}</div>
        <div style="color:var(--text-mute); font-size:12px; margin-top:2px;">${refLabel("clients", t.clienteId)} · vence ${fmtDate(t.deadline)}</div>
      </div>
      ${priorityBadge(t.prioridad)}
    </div>
  `).join("");
}
function renderMiniObjectives(list){
  if(!list.length) return emptyState("🎯","Sin objetivos aún","Agrega tus metas del mes en el módulo Objetivos.");
  return list.map(o => `
    <div class="content-item">
      <div>

}

/* ---------- VISTA CRUD GENÉRICA (clientes, tareas, proyectos, docs, prospectos, servicios, cotizaciones, objetivos) ---------- */
function renderCrudView(key){
  const schema = SCHEMAS[key];
  const rows = state.cache[schema.collection] || [];
  const search = (state.filters[key]?.q || "").toLowerCase();
  const filtered = search ? rows.filter(r => JSON.stringify(r).toLowerCase().includes(search)) : rows;

  viewRoot.innerHTML = `
    <div class="section-head">
      <h2>${schema.icon} ${schema.label}</h2>
      <button class="btn btn-primary" id="btn-add">+ Nuevo ${schema.singular.toLowerCase()}</button>
    </div>
    <div class="toolbar">
      <input type="search" placeholder="Buscar..." id="search-input" value="${search}" />
    </div>
    <div id="table-root"></div>
  `;
  document.getElementById("table-root").innerHTML = buildTable(key, filtered);
  document.getElementById("btn-add").addEventListener("click", ()=>openModal(key));
  document.getElementById("search-input").addEventListener("input", (e)=>{
    state.filters[key] = { q: e.target.value };
    renderCrudView(key);
  });
  bindTableRowEvents(key);
}

function buildTable(key, rows){
  const schema = SCHEMAS[key];
  if(!rows.length){
    return `<div class="table-wrap"><div class="empty-state"><div class="ic">${schema.icon}</div><h3>Aún no hay ${schema.label.toLowerCase()}</h3><p>Agrega el primer registro con el botón "+ Nuevo ${schema.singular.toLowerCase()}".</p></div></div>`;
  }
  const cols = schema.columns;
  return `
    <div class="table-wrap">
      <table>
        <thead><tr>${cols.map(c=>`<th>${fieldLabel(schema,c)}</th>`).join("")}<th></th></tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              ${cols.map(c => `<td>${renderCell(schema, c, r)}</td>`).join("")}
              <td>
                <div class="row-actions">
                  <button class="icon-btn" data-edit="${r.id}" title="Editar">✎</button>
                  <button class="icon-btn" data-del="${r.id}" title="Eliminar">🗑</button>
                </div>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}
function fieldLabel(schema, key){
  if(key==="progreso") return "Progreso";
  const f = schema.fields.find(f=>f.key===key);
  return f ? f.label : key;
}
function renderCell(schema, key, row){
  if(key==="progreso") return `${row.progresoActual||0} / ${row.progresoObjetivo||0}`;
  const f = schema.fields.find(f=>f.key===key);
  const val = row[key];
  if(!f) return escapeHtml(val ?? "—");
  if(f.type==="select-ref") return escapeHtml(refLabel(f.ref, val));
  if(f.type==="date") return fmtDate(val);
  if(key==="monto" || key==="precioMensual" || key==="precio" || key==="total") return fmtMoney(val);
  if(key==="estado") return badgeHtml(val);
  if(key==="prioridad") return priorityBadge(val);
  return escapeHtml(val ?? "—") || "—";
}
function bindTableRowEvents(key){
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>openModal(key, b.dataset.edit)));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>confirmDelete(key, b.dataset.del)));
}
function confirmDelete(key, id){
  const schema = SCHEMAS[key];
  if(!confirm(`¿Eliminar este ${schema.singular.toLowerCase()}? Esta acción no se puede deshacer.`)) return;
  deleteDoc(doc(db, schema.collection, id))
    .then(()=>toast(schema.singular + " eliminado."))
    .catch(()=>toast("No se pudo eliminar.", true));
}
function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function emptyState(icon, title, text){
  return `<div class="empty-state"><div class="ic">${icon}</div><h3>${title}</h3><p>${text}</p></div>`;
}

  const row = editId ? (state.cache[schema.collection]||[]).find(r=>r.id===editId) : null;
  modalTitle.textContent = (editId ? "Editar " : "Nuevo ") + schema.singular.toLowerCase();

  modalGrid.innerHTML = schema.fields.map(f => {
    const value = row ? (row[f.key] ?? "") : (f.default ?? "");
    const fullClass = f.full ? "full" : "";
    if(f.type === "select"){
      return `<div class="field ${fullClass}"><label>${f.label}</label>
        <select name="${f.key}" ${f.required?"required":""}>
          <option value="">Selecciona…</option>
          ${f.options.map(o=>`<option value="${o}" ${value===o?"selected":""}>${o}</option>`).join("")}
        </select></div>`;
    }
    if(f.type === "select-ref"){
      const rows = state.cache[f.ref] || [];
      return `<div class="field ${fullClass}"><label>${f.label}</label>
        <select name="${f.key}">
          <option value="">Ninguno</option>
          ${rows.map(r=>`<option value="${r.id}" ${value===r.id?"selected":""}>${escapeHtml(r.nombre||r.empresa||r.titulo||"—")}</option>`).join("")}
        </select></div>`;
    }
    if(f.type === "textarea"){
      return `<div class="field ${fullClass}"><label>${f.label}</label><textarea name="${f.key}">${escapeHtml(value)}</textarea></div>`;
    }
    return `<div class="field ${fullClass}"><label>${f.label}</label>
      <input type="${f.type}" name="${f.key}" value="${escapeHtml(value)}" ${f.required?"required":""} />
    </div>`;
  }).join("");

  modalOverlay.style.display = "flex";
}
function closeModal(){ modalOverlay.style.display = "none"; modalForm.reset(); }
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal-cancel").addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e)=>{ if(e.target === modalOverlay) closeModal(); });

modalForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const { schemaKey, editId } = state.modal;
  const schema = SCHEMAS[schemaKey];
  const data = {};
  schema.fields.forEach(f => {
    const el = modalForm.elements[f.key];
    if(!el) return;
    data[f.key] = f.type === "number" ? (el.value === "" ? null : Number(el.value)) : el.value;
  });
  const saveBtn = document.getElementById("modal-save");
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="loader"></span>';
  try {
    if (editId) {
      await updateDoc(doc(db, schema.collection, editId), data);
      toast(schema.singular + " actualizado.");
    } else {
      data.creadoEn = serverTimestamp();
      await addDoc(collection(db, schema.collection), data);
      toast(schema.singular + " creado.");
    }
    closeModal();
  } catch (err) {
    console.error(err);
    toast("No se pudo guardar. Revisa la conexión o las reglas de Firestore.", true);
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Guardar";
  }
});
</script>

</body>
